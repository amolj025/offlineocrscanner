name: Build Offline OCR Android APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build and Test APK
runs-on: ubuntu-24.04

```
defaults:
  run:
    working-directory: ./OfflineOCRScanner

steps:
  - name: Checkout source code
    uses: actions/checkout@v5

  - name: Setup Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '8.9'
      build-root-directory: ./OfflineOCRScanner
      cache-provider: basic

  - name: Verify Project Files
    run: |
      pwd
      ls -la
      ls -la app

  - name: Install Android SDK
    run: |
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  - name: Clean Project
    run: gradle --no-daemon clean

  - name: Run Unit Tests
    run: gradle --no-daemon testDebugUnitTest --stacktrace

  - name: Build Debug APK
    run: gradle --no-daemon assembleDebug --stacktrace

  - name: Verify APK
    run: |
      test -f app/build/outputs/apk/debug/app-debug.apk
      ls -lh app/build/outputs/apk/debug/

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: OfflineOCRScanner-debug-apk
      path: OfflineOCRScanner/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 30
```
