name: Build Offline OCR Android APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build and Test APK
runs-on: ubuntu-24.04

```
steps:

  # 1. Checkout repository
  - name: Checkout source code
    uses: actions/checkout@v5

  # 2. Extract uploaded ZIP
  - name: Extract Android Project
    run: |
      echo "Extracting Android project..."

      ZIP_FILE="OfflineOCRScanner-Android-Project.zip"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "ERROR: Project ZIP not found"
        ls -la
        exit 1
      fi

      unzip -o "$ZIP_FILE" -d .

      echo "ZIP extracted successfully"

      find . -name settings.gradle -not -path './.git/*'

  # 3. Setup Java
  - name: Setup Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  # 4. Setup Android SDK
  - name: Setup Android SDK
    uses: android-actions/setup-android@v4

  # 5. Locate project
  - name: Locate Android Project
    id: locate
    shell: bash
    run: |
      PROJECT_FILE=$(find . \
        -name settings.gradle \
        -not -path './.git/*' \
        -not -path '*/build/*' \
        -print -quit)

      if [ -z "$PROJECT_FILE" ]; then
        echo "ERROR: settings.gradle not found"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$PROJECT_FILE")

      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      echo "Found project: $PROJECT_DIR"

      test -f "$PROJECT_DIR/build.gradle"
      test -f "$PROJECT_DIR/gradle.properties"
      test -f "$PROJECT_DIR/app/build.gradle"

      echo "Project structure verified"

  # 6. Setup Gradle
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '8.9'
      cache-provider: basic

  # 7. Install Android SDK
  - name: Install Android SDK
    run: |
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  # 8. Clean project
  - name: Clean Project
    working-directory: ${{ steps.locate.outputs.project_dir }}
    run: gradle --no-daemon clean --stacktrace

  # 9. Run tests
  - name: Run Unit Tests
    working-directory: ${{ steps.locate.outputs.project_dir }}
    run: |
      gradle --no-daemon testDebugUnitTest \
        --stacktrace

  # 10. Build APK
  - name: Build Debug APK
    working-directory: ${{ steps.locate.outputs.project_dir }}
    run: |
      gradle --no-daemon assembleDebug \
        --stacktrace

  # 11. Verify APK
  - name: Verify APK
    working-directory: ${{ steps.locate.outputs.project_dir }}
    run: |
      APK="app/build/outputs/apk/debug/app-debug.apk"

      test -f "$APK"

      echo "APK generated successfully"
      ls -lh "$APK"

  # 12. Upload APK
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: OfflineOCRScanner-debug-apk
      path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 30
```
