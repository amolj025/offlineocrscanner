name: OCR Vision Pro APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Extract uploaded ZIP
        run: |
          if [ -f OfflineOCRScanner-Android-Project.zip ]; then
            unzip -o OfflineOCRScanner-Android-Project.zip -d .
          fi
      - name: Locate project
        id: project
        shell: bash
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' -not -path '*/build/*' -print -quit)
          if [ -z "$F" ]; then echo "settings.gradle not found"; find . -maxdepth 3 -type f; exit 1; fi
          D=$(dirname "$F")
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          test -f "$D/app/build.gradle"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Download offline English OCR model
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L --fail --retry 3 https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata -o app/src/main/assets/tessdata/eng.traineddata
          test -s app/src/main/assets/tessdata/eng.traineddata
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OCR-Vision-Pro-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
