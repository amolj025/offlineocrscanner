name: Build Offline OCR Android APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build and Test APK
runs-on: ubuntu-24.04

```
steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Extract Project ZIP
    run: |
      unzip -o OfflineOCRScanner-Android-Project.zip -d .

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4

  - name: Locate Project
    id: locate
    run: |
      PROJECT_FILE=$(find . -name settings.gradle -not -path './.git/*' -print -quit)
      if [ -z "$PROJECT_FILE" ]; then
        echo "settings.gradle not found"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$PROJECT_FILE")
      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      test -f "$PROJECT_DIR/build.gradle"
      test -f "$PROJECT_DIR/gradle.properties"
      test -f "$PROJECT_DIR/app/build.gradle"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '8.9'
      cache-provider: basic

  - name: Install Android SDK
    run: |
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  - name: Clean
    working-directory: ${{ steps.locate.outputs.project_dir }}
    run: gradle --no-daemon clean

  - name: Run Tests
    working-directory: ${{ steps.locate.outputs.project_dir }}
    run: gradle --no-daemon testDebugUnitTest --stacktrace

  - name: Build APK
    working-directory: ${{ steps.locate.outputs.project_dir }}
    run: gradle --no-daemon assembleDebug --stacktrace

  - name: Verify APK
    working-directory: ${{ steps.locate.outputs.project_dir }}
    run: test -f app/build/outputs/apk/debug/app-debug.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: OfflineOCRScanner-debug-apk
      path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 30
```
