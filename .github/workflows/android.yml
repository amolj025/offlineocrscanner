name: Build Offline OCR Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test APK
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------
      # 1. Checkout GitHub Repository
      # ---------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5

      # ---------------------------------
      # 2. Setup Java 17
      # ---------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------
      # 3. Setup Android SDK
      # ---------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ---------------------------------
      # 4. Locate Android Project
      # ---------------------------------

      - name: Locate Android Project
        id: locate
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          PROJECT_FILE=$(find . \
            -name settings.gradle \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "Project directory: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Checking required files..."

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "Android project verified."

          ls -la "$PROJECT_DIR"

      # ---------------------------------
      # 5. Setup Gradle
      # ---------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          build-root-directory: ${{ steps.locate.outputs.project_dir }}
          cache-provider: basic

      # ---------------------------------
      # 6. Install Android SDK Packages
      # ---------------------------------

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # ---------------------------------
      # 7. Check Gradle Configuration
      # ---------------------------------

      - name: Verify Gradle
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          gradle --version

      # ---------------------------------
      # 8. Clean Project
      # ---------------------------------

      - name: Clean Project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          gradle --no-daemon clean --stacktrace

      # ---------------------------------
      # 9. Run Unit Tests
      # ---------------------------------

      - name: Run Unit Tests
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          gradle --no-daemon testDebugUnitTest \
            --stacktrace \
            --info

      # ---------------------------------
      # 10. Build Android APK
      # ---------------------------------

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          gradle --no-daemon assembleDebug \
            --stacktrace

      # ---------------------------------
      # 11. Verify APK
      # ---------------------------------

      - name: Verify APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          echo "APK successfully generated!"
          ls -lh "$APK"

      # ---------------------------------
      # 12. Upload APK
      # ---------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineOCRScanner-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
