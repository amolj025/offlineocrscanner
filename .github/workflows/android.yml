name: Offline OCR Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build and Test APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Project ZIP
        run: |
          unzip -o OfflineOCRScanner-Android-Project.zip -d .

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' -not -path '*/build/*' -print -quit)

          if [ -z "$FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          test -f "$DIR/build.gradle"
          test -f "$DIR/gradle.properties"
          test -f "$DIR/app/build.gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Clean Project
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean

      - name: Run Unit Tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineOCRScanner-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
